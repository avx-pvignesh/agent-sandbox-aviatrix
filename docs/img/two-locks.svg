<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1480 900" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="blue" markerWidth="11" markerHeight="11" refX="8" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 z" fill="#2563a8"/></marker>
    <marker id="grn" markerWidth="11" markerHeight="11" refX="8" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 z" fill="#059669"/></marker>
    <marker id="red" markerWidth="11" markerHeight="11" refX="8" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 z" fill="#dc2626"/></marker>
    <filter id="sh" x="-6%" y="-6%" width="112%" height="118%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.12"/></filter>
  </defs>

  <rect width="1480" height="900" fill="#ffffff"/>
  <text x="60" y="52" font-size="30" font-weight="700" fill="#15223a">Two locks on the agent's door</text>
  <text x="60" y="84" font-size="18" fill="#5b6775">MicroVM sandbox and credential proxy on the host, with an Aviatrix DCF backstop at the VPC edge</text>

  <!-- VPC -->
  <rect x="48" y="118" width="1010" height="610" rx="16" fill="#eef4fb" stroke="#2563a8" stroke-width="2"/>
  <text x="68" y="146" font-size="16" font-weight="700" fill="#1f4e79">Spoke VPC — dedicated AWS account</text>
  <text x="68" y="168" font-size="14" fill="#5b6775">host subnet default route (0.0.0.0/0) → Aviatrix spoke gateway · no IGW / NAT</text>

  <!-- Host -->
  <rect x="72" y="196" width="600" height="500" rx="14" fill="#f8fafc" stroke="#475569" stroke-width="2"/>
  <text x="90" y="224" font-size="15" font-weight="700" fill="#334155">EC2 host — bare-metal / nested-virt</text>
  <text x="90" y="245" font-size="13" fill="#64748b">KVM + Docker + Kata Containers + Firecracker</text>

  <!-- Internal agents network -->
  <rect x="92" y="268" width="250" height="406" rx="12" fill="#f1f5f9" stroke="#64748b" stroke-width="2" stroke-dasharray="6 5"/>
  <text x="108" y="294" font-size="13.5" font-weight="700" fill="#475569">Internal "agents" net</text>
  <text x="108" y="313" font-size="12.5" fill="#64748b">no route out</text>

  <!-- Agent microVM -->
  <rect x="110" y="330" width="214" height="104" rx="10" fill="#e0ecfb" stroke="#2563a8" stroke-width="2" filter="url(#sh)"/>
  <text x="217" y="362" font-size="16" font-weight="700" fill="#1f4e79" text-anchor="middle">Agent microVM</text>
  <text x="217" y="386" font-size="13" fill="#3b5572" text-anchor="middle">Claude Code agent</text>
  <text x="217" y="406" font-size="13" fill="#3b5572" text-anchor="middle">placeholder key only</text>
  <text x="217" y="424" font-size="12" fill="#64748b" text-anchor="middle">Firecracker VM · own kernel</text>

  <!-- Target microVM -->
  <rect x="110" y="470" width="214" height="86" rx="10" fill="#eef2f7" stroke="#64748b" stroke-width="1.6"/>
  <text x="217" y="502" font-size="15" font-weight="700" fill="#475569" text-anchor="middle">Target microVM</text>
  <text x="217" y="524" font-size="13" fill="#64748b" text-anchor="middle">OWASP Juice Shop</text>
  <text x="217" y="543" font-size="12" fill="#8a94a1" text-anchor="middle">deliberately vulnerable</text>

  <!-- Trusted proxies -->
  <text x="500" y="294" font-size="13.5" font-weight="700" fill="#9a4716" text-anchor="middle">trusted side (host)</text>

  <rect x="392" y="312" width="258" height="104" rx="10" fill="#fde8d7" stroke="#c2571d" stroke-width="2.2" filter="url(#sh)"/>
  <text x="521" y="342" font-size="16" font-weight="700" fill="#9a4716" text-anchor="middle">Credential proxy</text>
  <text x="521" y="365" font-size="12.5" fill="#7c4a28" text-anchor="middle">holds model key · injects per request</text>
  <text x="521" y="384" font-size="12.5" fill="#7c4a28" text-anchor="middle">allows only /model/&lt;our profile&gt;</text>
  <text x="521" y="403" font-size="12" fill="#a06a42" text-anchor="middle">~130 lines · stdlib · read-only</text>

  <rect x="392" y="452" width="258" height="96" rx="10" fill="#fde8d7" stroke="#c2571d" stroke-width="2.2" filter="url(#sh)"/>
  <text x="521" y="482" font-size="16" font-weight="700" fill="#9a4716" text-anchor="middle">Egress proxy</text>
  <text x="521" y="505" font-size="12.5" fill="#7c4a28" text-anchor="middle">allowlist (empty by default)</text>
  <text x="521" y="524" font-size="12.5" fill="#7c4a28" text-anchor="middle">denies all other destinations</text>

  <!-- Aviatrix gateway -->
  <rect x="712" y="300" width="312" height="300" rx="14" fill="#1f4e79" stroke="#15375c" stroke-width="2" filter="url(#sh)"/>
  <text x="868" y="334" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">Aviatrix Spoke Gateway</text>
  <text x="868" y="358" font-size="14" font-weight="600" fill="#bcd6f2" text-anchor="middle">Distributed Cloud Firewall</text>
  <line x1="740" y1="374" x2="996" y2="374" stroke="#3b6291" stroke-width="1.4"/>
  <text x="740" y="402" font-size="13.5" fill="#eaf2fb">▸ TLS decryption + URL filter</text>
  <text x="740" y="428" font-size="13.5" fill="#eaf2fb">▸ Permit: the exact model URL only</text>
  <text x="740" y="454" font-size="13.5" fill="#eaf2fb">▸ Default deny — everything else</text>
  <text x="740" y="480" font-size="13.5" fill="#eaf2fb">▸ Every attempt logged in CoPilot</text>
  <rect x="740" y="500" width="256" height="40" rx="8" fill="#163a5f" stroke="#3b6291" stroke-width="1.2"/>
  <text x="868" y="525" font-size="12.5" fill="#bcd6f2" text-anchor="middle">independent of the proxies — different code</text>

  <!-- Model API -->
  <rect x="1098" y="360" width="320" height="150" rx="14" fill="#ecfdf5" stroke="#059669" stroke-width="2" filter="url(#sh)"/>
  <text x="1258" y="396" font-size="17" font-weight="700" fill="#065f46" text-anchor="middle">Model API</text>
  <text x="1258" y="420" font-size="14" fill="#15795c" text-anchor="middle">Amazon Bedrock</text>
  <text x="1258" y="450" font-size="11.5" fill="#2f8f72" text-anchor="middle">bedrock-runtime.us-east-1.amazonaws.com</text>
  <text x="1258" y="470" font-size="11.5" fill="#2f8f72" text-anchor="middle">/model/&lt;profile&gt;/invoke-with-response-stream</text>

  <!-- FLOW ARROWS -->
  <!-- agent -> credproxy -->
  <path d="M324,372 L388,366" stroke="#2563a8" stroke-width="2.4" fill="none" marker-end="url(#blue)"/>
  <text x="356" y="356" font-size="11.5" fill="#2563a8" text-anchor="middle">model call</text>
  <!-- agent -> egress proxy -->
  <path d="M324,500 L388,500" stroke="#2563a8" stroke-width="2.4" fill="none" marker-end="url(#blue)"/>
  <text x="356" y="490" font-size="11.5" fill="#2563a8" text-anchor="middle">other egress</text>
  <!-- credproxy -> gateway -->
  <path d="M650,364 L708,392" stroke="#2563a8" stroke-width="2.4" fill="none" marker-end="url(#blue)"/>
  <text x="678" y="360" font-size="11.5" fill="#2563a8" text-anchor="middle">+ real key</text>
  <!-- egress proxy -> gateway -->
  <path d="M650,500 L708,476" stroke="#2563a8" stroke-width="2.4" fill="none" marker-end="url(#blue)"/>
  <!-- gateway -> model (permit) -->
  <path d="M1024,420 L1094,430" stroke="#059669" stroke-width="3" fill="none" marker-end="url(#grn)"/>
  <text x="1060" y="412" font-size="12" font-weight="600" fill="#059669" text-anchor="middle">PERMIT</text>
  <text x="1060" y="455" font-size="11" fill="#15795c" text-anchor="middle">exact URL</text>

  <!-- denied -->
  <path d="M868,600 L868,648" stroke="#dc2626" stroke-width="2.4" fill="none" stroke-dasharray="7 5" marker-end="url(#red)"/>
  <rect x="690" y="650" width="356" height="56" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="1.8"/>
  <text x="868" y="674" font-size="13.5" font-weight="700" fill="#b91c1c" text-anchor="middle">DENY + log in CoPilot</text>
  <text x="868" y="694" font-size="12" fill="#c5403a" text-anchor="middle">other model · other account · any other host</text>

  <!-- LOCK 1 badge (on credproxy) -->
  <g>
    <circle cx="392" cy="312" r="21" fill="#c2571d" stroke="#ffffff" stroke-width="3"/>
    <text x="392" y="319" font-size="19" font-weight="700" fill="#ffffff" text-anchor="middle">1</text>
  </g>
  <!-- LOCK 2 badge (on gateway) -->
  <g>
    <circle cx="712" cy="300" r="21" fill="#0ea5a0" stroke="#ffffff" stroke-width="3"/>
    <text x="712" y="307" font-size="19" font-weight="700" fill="#ffffff" text-anchor="middle">2</text>
  </g>

  <!-- Legend -->
  <g transform="translate(1098,560)">
    <circle cx="14" cy="14" r="13" fill="#c2571d"/><text x="14" y="20" font-size="15" font-weight="700" fill="#fff" text-anchor="middle">1</text>
    <text x="38" y="12" font-size="13.5" font-weight="700" fill="#15223a">Lock 1 — credential proxy</text>
    <text x="38" y="30" font-size="12.5" fill="#5b6775">in-host, application layer</text>
    <circle cx="14" cy="62" r="13" fill="#0ea5a0"/><text x="14" y="68" font-size="15" font-weight="700" fill="#fff" text-anchor="middle">2</text>
    <text x="38" y="60" font-size="13.5" font-weight="700" fill="#15223a">Lock 2 — Aviatrix DCF</text>
    <text x="38" y="78" font-size="12.5" fill="#5b6775">network edge, independent</text>
    <text x="0" y="112" font-size="12.5" fill="#5b6775">A bug in Lock 1 doesn't open the door:</text>
    <text x="0" y="130" font-size="12.5" fill="#5b6775">Lock 2 still permits only the exact URL.</text>
  </g>

  <text x="60" y="770" font-size="13" fill="#8a94a1">The model's own safety classifier is a third, independent layer — it can refuse an unsafe task before the agent acts.</text>
</svg>
